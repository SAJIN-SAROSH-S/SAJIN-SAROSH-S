<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#388bfd" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#238636" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1f6feb" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="50%" stop-color="#2f81f7" />
      <stop offset="100%" stop-color="#0969da" />
    </linearGradient>
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="850" height="200" rx="12" fill="url(#bgGrad)" />
  <rect width="850" height="200" rx="12" fill="none" stroke="#30363d" stroke-width="1.2" />

  <!-- Background Grid Dots -->
  <g opacity="0.12" fill="#8b949e">
    <circle cx="320" cy="40" r="1.5"/><circle cx="360" cy="40" r="1.5"/><circle cx="400" cy="40" r="1.5"/><circle cx="440" cy="40" r="1.5"/>
    <circle cx="320" cy="70" r="1.5"/><circle cx="360" cy="70" r="1.5"/><circle cx="400" cy="70" r="1.5"/><circle cx="440" cy="70" r="1.5"/>
    <circle cx="320" cy="100" r="1.5"/><circle cx="360" cy="100" r="1.5"/><circle cx="400" cy="100" r="1.5"/><circle cx="440" cy="100" r="1.5"/>
  </g>

  <!-- Flowing Waves -->
  <path d="M 0,145 Q 200,185 420,150 T 850,155 L 850,200 L 0,200 Z" fill="url(#waveGrad1)" />
  <path d="M 0,160 Q 230,125 450,165 T 850,150 L 850,200 L 0,200 Z" fill="url(#waveGrad2)" />
  <path d="M 0,175 Q 180,155 380,180 T 850,170 L 850,200 L 0,200 Z" fill="url(#waveGrad3)" />

  <!-- Terminal Window Controls -->
  <circle cx="40" cy="32" r="4.5" fill="#ff5f56"/>
  <circle cx="54" cy="32" r="4.5" fill="#ffbd2e"/>
  <circle cx="68" cy="32" r="4.5" fill="#27c93f"/>

  <!-- Badge Tag -->
  <g transform="translate(40, 52)">
    <rect width="215" height="22" rx="11" fill="#1f6feb" fill-opacity="0.18" stroke="#388bfd" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="12" cy="11" r="3.5" fill="#388bfd"/>
    <text x="24" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#58a6ff" letter-spacing="0.8">CLOUD &amp; DEVOPS SYSTEMS</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="40" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="0.3">Sajin Sarosh S</text>
  <text x="40" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#8b949e">Junior DevOps Engineer  |  Cloud Architecture &amp; CI/CD Automation</text>

  <!-- Right Side Decorative Cloud / Server Icon -->
  <g transform="translate(690, 42)" opacity="0.9">
    <!-- Server Stack -->
    <rect x="15" y="15" width="80" height="22" rx="5" fill="#161b22" stroke="#388bfd" stroke-width="1.2"/>
    <circle cx="28" cy="26" r="3" fill="#388bfd"/>
    <line x1="40" y1="26" x2="82" y2="26" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>

    <rect x="15" y="44" width="80" height="22" rx="5" fill="#161b22" stroke="#388bfd" stroke-width="1.2"/>
    <circle cx="28" cy="55" r="3" fill="#238636"/>
    <line x1="40" y1="55" x2="82" y2="55" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>

    <rect x="15" y="73" width="80" height="22" rx="5" fill="#161b22" stroke="#388bfd" stroke-width="1.2"/>
    <circle cx="28" cy="84" r="3" fill="#f0883e"/>
    <line x1="40" y1="84" x2="82" y2="84" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>

    <!-- Connecting Link Line -->
    <path d="M 55,95 L 55,108 Q 55,115 65,115 L 75,115" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
</svg>
